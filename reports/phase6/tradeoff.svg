  --border: #3a3a37; --s1: #3987e5; --s2: #d95926; }
 text { font: 12px system-ui, sans-serif; fill: var(--text-2); } .lbl { fill: var(--text); }</style><rect width="760" height="380" rx="10" fill="var(--surface)"/><line x1="56" x2="610" y1="332.0" y2="332.0" stroke="var(--grid)" stroke-width="1"/><text x="48" y="336.0" text-anchor="end">10</text><line x1="56" x2="610" y1="269.6" y2="269.6" stroke="var(--grid)" stroke-width="1"/><text x="48" y="273.6" text-anchor="end">20</text><line x1="56" x2="610" y1="207.2" y2="207.2" stroke="var(--grid)" stroke-width="1"/><text x="48" y="211.2" text-anchor="end">30</text><line x1="56" x2="610" y1="144.8" y2="144.8" stroke="var(--grid)" stroke-width="1"/><text x="48" y="148.8" text-anchor="end">40</text><line x1="56" x2="610" y1="82.4" y2="82.4" stroke="var(--grid)" stroke-width="1"/><text x="48" y="86.4" text-anchor="end">50</text><line x1="56" x2="610" y1="20.0" y2="20.0" stroke="var(--grid)" stroke-width="1"/><text x="48" y="24.0" text-anchor="end">60</text><text x="56.0" y="350" text-anchor="middle">0</text><text x="125.2" y="350" text-anchor="middle">5</text><text x="194.5" y="350" text-anchor="middle">10</text><text x="263.8" y="350" text-anchor="middle">15</text><text x="333.0" y="350" text-anchor="middle">20</text><text x="402.2" y="350" text-anchor="middle">25</text><text x="471.5" y="350" text-anchor="middle">30</text><text x="540.8" y="350" text-anchor="middle">35</text><text x="610.0" y="350" text-anchor="middle">40</text><line x1="56" x2="610" y1="332" y2="332" stroke="var(--border)"/><text x="333" y="370" text-anchor="middle">Seconds per question (mean, local M4 Pro)</text><text x="14" y="176" text-anchor="middle" transform="rotate(-90 14 176)">Execution accuracy (%)</text><g class="pt" data-tip="Baseline: whole schema, one call: EX 47.4%, 4.1 s/question"><circle cx="113.2" cy="98.6" r="12" fill="transparent"/><circle cx="113.2" cy="98.6" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text class="lbl" x="122.2" y="102.6">Baseline</text></g><g class