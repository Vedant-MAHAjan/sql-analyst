<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Accuracy vs time per question"><style>
:root { color-scheme: light; --surface: #fcfcfb; --page: #f4f4f2; --text: #0b0b0b;
