# Phase 6 ablation: tiering. 7B names tables (added to lexical linking), 14B writes SQL.
name: agent-tiered-noevidence
dataset: bird
evidence: false
linking:
  mode: table
  max_tables: 5
  min_table_score: 0.3
  describe: false
  llm_linker:
    provider: ollama
    model: qwen2.5-coder:7b
    options: {temperature: 0.0, seed: 0, num_ctx: 8192}
agent: {repair_max: 2, validate: true}
model:
  provider: ollama
  model: qwen2.5-coder:14b
  options: {temperature: 0.0, seed: 0, num_ctx: 8192}
